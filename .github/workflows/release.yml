name: Release

# Builds CTWaits.exe and ctwaits-mcp.exe on Windows and attaches them to a GitHub Release
# whenever a version tag (v1.0.0, v1.1.0, ...) is pushed. "Run workflow" on the Actions tab
# builds the exes as a downloadable artifact without making a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test and build
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ontario-wait-times-exes
          path: |
            dist/CTWaits.exe
            dist/ctwaits-mcp.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/CTWaits.exe dist/ctwaits-mcp.exe --title "Ontario Wait Times ${{ github.ref_name }}" --generate-notes
