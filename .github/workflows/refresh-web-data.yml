name: Refresh web data

# Rebuilds docs/screening.js (breast screening snapshot) and docs/contacts.js every day,
# because the breast screening API only answers pages on www.ontariohealth.ca.
on:
  schedule:
    - cron: "17 10 * * *"   # 06:17 Toronto time (EDT)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data files
        run: python src/build_web_data.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/screening.js docs/contacts.js
          git diff --cached --quiet || git commit -m "Refresh breast screening snapshot"
          git push
